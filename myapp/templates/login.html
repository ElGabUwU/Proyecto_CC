{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons (para el ícono del ojo) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- css -->
    <link href="{% static 'assets/styles/login.css' %}" rel="stylesheet" />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'assets/images/aguila.ico' %}">
    <style>
        
    </style>
    
</head>

<body class="d-flex">
    <div class="container-fluid h-100 p-0"> <!-- h-100 aquí -->
        <div class="row h-100 g-0"> <!-- h-100 aquí también -->

            <!-- Columna izquierda -->
            <div class="col-12 col-lg-6 bg-light p-4 px-lg-5  position-relative">
                <!-- Fondo expandido -->
                <div class="fade-white-left "></div>
                <!-- Contenido centrado -->
                <div class="d-flex flex-column h-100 my-auto text-center">
                    <!-- Icono del usuario -->
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" fill="#007bff"
                            class="bi bi-person-circle" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                            <path fill-rule="evenodd"
                                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
                        </svg>
                    </div>

                    <h1 class="display-5 fw-bold">¡Bienvenido!</h1>
                    <p class="lead fs-3 mb-4">Ingresa tus datos de inicio de sesión</p>

                    <!-- Mensajes de error -->
                    {% if messages %}
                        {% for message in messages %}
                            {% if message.tags == 'error' %}
                                <div class="alert alert-danger">{{ message }}</div>
                            {% endif %}
                        {% endfor %}
                    {% endif %}

                    <!-- Formulario -->
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <!-- Campo Usuario -->
                        <div class="mt-4 mb-3 text-start  ">
                            <label for="username" class="form-label"><strong>Usuario <span
                                        class="text-danger">*</span></strong></label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Ingrese su nombre de usuario" required>
                        </div>
                        <!-- Campo Contraseña -->
                        <!-- Campo Contraseña -->
                        <div class="mb-4 text-start position-relative">
                            <label for="password" class="form-label"><strong>Contraseña <span class="text-danger">*</span></strong></label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Ingrese su contraseña" required>
                            <button class="btn position-absolute end-0 translate-middle-y"
                                    type="button" id="togglePassword" style="background-color: transparent; border: none; z-index: 10; top: 74%;  border-top-left-radius: 0; border-bottom-left-radius: 0; outline: none !important;">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <!-- Botón -->
                        <button type="submit" class="btn btn-danger w-100">Acceder</button>
                    </form>
                </div>
            </div>

            <!-- Columna derecha: solo visible en lg+ -->
            <div class="col-lg-6 d-none d-lg-block position-relative">
                <div class="h-100 d-flex flex-column justify-content-center align-items-center text-white">
                    <!-- Fondo con degradado -->
                    <div class="fade-white"></div>
                    <!-- Contenido centrado -->
                    <div class="my-auto text-center z-1">
                        <h1 class="display-4 fw-bold text-danger mb-2">Consejo Comunal</h1>
                        <img src="../../static/assets/images/CC_logo.png" alt="Logo TheProfessor" class="img-fluid mb-4"
                            style="width: 250px;">
                        <p class="fw-bold lead mb-1 text-primary">Urbanización Manuel Pulido Méndez</p>
                        <p class="fw-bold lead text-danger"></p>
                    </div>
                </div>
            </div> <!-- final columna -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#password');
            const eyeIcon = document.querySelector('#eyeIcon');

            if (togglePassword && password && eyeIcon) {
                togglePassword.addEventListener('click', function () {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    // Cambia el ícono
                    eyeIcon.classList.toggle('bi-eye');
                    eyeIcon.classList.toggle('bi-eye-slash');
                });
            }
        });
    </script>
</body>

</html>
