<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"  rel="stylesheet"/>
  <style>
    body {
      margin: 0;
    }
    .fade-white {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: linear-gradient(to right, #f8f9fa, rgba(255, 255, 255, 0)), url('https://via.placeholder.com/800x600'); 
      background-size: cover;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="container-fluid h-100">
    <div class="row min-vh-100 g-0">

      <!-- Columna izquierda -->
      <div class="col-12 col-lg-6 bg-light d-flex flex-column justify-content-center p-4 px-lg-5">
        <div class="text-center mb-4">
          <h1>¡Bienvenido!</h1>
          <p>Inicia sesión</p>
        </div>
        <form>
          <input type="text" class="form-control mb-3" placeholder="Usuario">
          <input type="password" class="form-control mb-3" placeholder="Contraseña">
          <button class="btn btn-danger w-100">Acceder</button>
        </form>
      </div>

      <!-- Columna derecha -->
      <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white position-relative">
        <div class="fade-white"></div>
        <div class="z-1 text-center p-4">
          <h1 class="display-4 fw-bold text-danger">TheProfessor</h1>
          <img src="https://via.placeholder.com/300x300"  alt="Logo" class="img-fluid mb-4" style="max-width: 500px;">
          <p class="lead text-primary">Learn languages with an expert</p>
          <p class="lead text-danger">Languages Academy</p>
        </div>
      </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
